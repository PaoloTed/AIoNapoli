[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "napoli-agentic-city-backend"
version = "1.0.0"
description = "Backend del sistema Napoli Agentic City: connettori, agenti specializzati, orchestratore."
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.115",
    "uvicorn[standard]~=0.32",
    "pydantic~=2.9",
    "sse-starlette~=2.1",
    "PyYAML~=6.0",
    "httpx~=0.27",
    "feedparser~=6.0",
    "tzdata~=2024.2",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary,pool]~=3.2",
]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=0.24",
    "pytest-cov~=5.0",
    "pytest-socket~=0.7",
    "testcontainers~=4.8",
    "ruff~=0.7",
]

[tool.setuptools]
package-dir = { "app" = "backend/app", "shared" = "shared" }
packages = [
    "app",
    "app.api",
    "app.api.middleware",
    "app.api.v1",
    "app.db",
    "app.domain",
    "app.domain.logic",
    "app.domain.models",
    "app.repositories",
    "app.services",
    "app.services.agents",
    "app.services.agents.context",
    "app.services.agents.crowding",
    "app.services.agents.mobility",
    "app.services.connectors",
    "app.services.connectors.events",
    "app.services.connectors.gtfs",
    "app.services.connectors.occupancy",
    "app.services.connectors.rss",
    "app.services.connectors.weather",
    "app.services.orchestrator",
    "app.services.validation",
    "app.utils",
    "shared",
    "shared.schemas",
]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["tests"]
norecursedirs = ["anm_info", "frontend", ".venv", "build", "dist"]
markers = [
    "network: tests requiring external network access (disabled by default)",
    "db: tests requiring external Postgres database via Docker/testcontainers",
]
addopts = "-m 'not network' --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "shared", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

